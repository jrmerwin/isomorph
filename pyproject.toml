[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isomorph"
version = "1.0.0"
description = "Validated motif libraries from event streams, and how much they transfer between systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[project.scripts]
isomorph = "isomorph.cli:main"

[tool.setuptools.packages.find]
include = ["isomorph*"]
